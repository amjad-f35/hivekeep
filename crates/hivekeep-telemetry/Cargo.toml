[package]
name = "hivekeep-telemetry"
description = "Hivekeep process boot, logging, OpenTelemetry setup, gRPC interceptors and the node OTLP relay."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "hivekeep-otlp-relay"
path = "src/main.rs"

[dependencies]
hivekeep-proto = { workspace = true }
hivekeep-core = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }
prost-reflect = { workspace = true }
tonic = { workspace = true, features = ["gzip"] }
tokio = { workspace = true }
tokio-stream = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
uuid = { workspace = true }
url = { workspace = true }
http = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
tower = { workspace = true }
bytes = { workspace = true }
prometheus = { workspace = true }
parking_lot = { workspace = true }
chrono = { workspace = true }
lru = { workspace = true }
percent-encoding = { workspace = true }
http-body-util = { workspace = true }
http-body = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
opentelemetry-otlp = { workspace = true }
opentelemetry-proto = { workspace = true }
opentelemetry-prometheus = { workspace = true }
tracing-opentelemetry = { workspace = true }
opentelemetry-semantic-conventions = { workspace = true }

[dev-dependencies]
opentelemetry_sdk = { workspace = true, features = ["testing"] }
tempfile = { workspace = true }
regex = { workspace = true }
