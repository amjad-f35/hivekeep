[package]
name = "hivekeep-demo-counter"
description = "Counter demo workload: shows which memory, volume and rootfs state survives an Actor's suspend and resume."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "counter"
path = "src/main.rs"

[dependencies]
hivekeep-telemetry = { workspace = true }
anyhow = { workspace = true }
axum = { workspace = true, features = ["query"] }
base64 = { workspace = true }
clap = { workspace = true }
nix = { workspace = true, features = ["net"] }
parking_lot = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tower = { workspace = true }
http-body-util = { workspace = true }
