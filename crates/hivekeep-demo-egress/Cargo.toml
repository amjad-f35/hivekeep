[package]
name = "hivekeep-demo-egress"
description = "Egress demo workload: fetches URLs, opens WebSockets, makes gRPC calls and sends CONNECTs on request, so an Actor's egress policy can be observed from outside."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "egress"
path = "src/main.rs"

[dependencies]
hivekeep-telemetry = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
http = { workspace = true }
httparse = { workspace = true }
prost = { workspace = true }
reqwest = { workspace = true, features = ["http2"] }
rustls = { workspace = true, features = ["ring"] }
rustls-native-certs = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-rustls = { workspace = true, features = ["ring"] }
tokio-stream = { workspace = true }
tokio-tungstenite = { workspace = true }
tokio-util = { workspace = true }
tonic = { workspace = true }
tonic-prost = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
x509-parser = { workspace = true }

[dev-dependencies]
http-body-util = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
libc = { workspace = true }
rcgen = { workspace = true }
tower = { workspace = true }

[build-dependencies]
tonic-prost-build = { workspace = true }
