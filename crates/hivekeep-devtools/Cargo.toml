[package]
name = "hivekeep-devtools"
description = "Developer tooling for Hivekeep: API lint and CI test-report checks."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "hivekeep-apitool"
path = "src/bin/hivekeep-apitool.rs"

[[bin]]
name = "hivekeep-junittool"
path = "src/bin/hivekeep-junittool.rs"

[dependencies]
hivekeep-telemetry = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# Compiles .proto sources at runtime (with comments) for the API lint.
protox = { workspace = true }
prost-reflect = { workspace = true }
quick-xml = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
