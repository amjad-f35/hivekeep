[package]
name = "hivekeep-gate"
description = "Hivekeep network mediation: ingress router, egress gateway, sandbox tunnel and DNS relay."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
build = "build.rs"

[lib]
path = "src/lib.rs"

[[bin]]
name = "hivekeep-gate"
path = "src/main.rs"

[dependencies]
hivekeep-telemetry = { workspace = true }
hivekeep-proto = { workspace = true }
hivekeep-core = { workspace = true }
hivekeep-identity = { workspace = true }

anyhow = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
futures = { workspace = true }
hex = { workspace = true }
http = { workspace = true }
humantime = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
ipnet = { workspace = true }
jsonwebtoken = { workspace = true }
libc = { workspace = true }
parking_lot = { workspace = true }
prometheus = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }
rcgen = { workspace = true }
regex = { workspace = true }
rustls-pemfile = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tokio-util = { workspace = true, features = ["rt", "io", "codec"] }
tonic = { workspace = true, features = ["tls-ring"] }
tonic-prost = { workspace = true }
tower = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
x509-parser = { workspace = true }

# Not in the workspace.
# Envoy xDS / SDS / ext_proc message and service types (prost 0.14, tonic 0.14).
envoy-types = { workspace = true }
# DNS wire format for the sandbox DNS relay.
# HTTP/2 CONNECT tunnels.
h2 = { workspace = true }
http-body-util = { workspace = true }
rand = { workspace = true }
socket2 = { workspace = true }
rustls = { workspace = true }
tokio-rustls = { workspace = true }
# Kubernetes access (k8s-openapi feature `v1_36`, matching the other crates).
kube = { workspace = true, features = ["runtime", "ws"] }
k8s-openapi = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
nix = { workspace = true, features = ["net", "socket", "sched", "fs", "ioctl"] }

[build-dependencies]
tonic-prost-build = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
serde_yaml = { workspace = true }
