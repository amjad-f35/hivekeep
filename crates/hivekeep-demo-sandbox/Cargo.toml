[package]
name = "hivekeep-demo-sandbox"
description = "Sandbox demo: a command-execution workload and an interactive client that resumes, drives and suspends it."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "sandbox"
path = "src/main.rs"

[[bin]]
name = "sandbox-client"
path = "src/bin/sandbox-client.rs"

[dependencies]
hivekeep-telemetry = { workspace = true }
anyhow = { workspace = true }
axum = { workspace = true, features = ["json"] }
clap = { workspace = true }
hivekeep-proto = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tonic = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
