// Worker is one schedulable worker pod. Global-scoped; its name is assigned by the
// control plane and must be treated as opaque. Only labels and epochs change.
message Worker {
  option (resource) = {
    scope : SCOPE_GLOBAL
    plural : "Workers"
  };

  // Rules: required; hive forbidden.
  ResourceMetadata metadata = 1;

  // Rules: required; dns-label; immutable.
  string worker_namespace = 2;
  // Rules: required; dns-subdomain; immutable.
  string worker_pool = 3;
  // Rules: required; dns-subdomain; immutable.
  string worker_pod = 4;
  // Rules: required; uuid; immutable.
  string worker_pod_uid = 5;
  // Rules: required; dns-subdomain; immutable.
  string node_name = 6;
  // Rules: max length 2048; custom checks; immutable.
  string worker_spiffe_id = 7;

  // Rules: max entries 64; each key: label-key; each value: label-value.
  map<string, string> labels = 8;

  WorkerStatus status = 9;
}

// Scheduling state of a Worker.
enum WorkerState {
  WORKER_STATE_UNSPECIFIED = 0;

  // Accepting new Actors.
  WORKER_STATE_ACTIVE = 1;

  // Shutting down; accepts nothing new. Terminal.
  WORKER_STATE_DRAINING = 2;

  // Temporarily not accepting new Actors.
  WORKER_STATE_UNAVAILABLE = 3;
}

// Server-owned state of a Worker.
message WorkerStatus {
  // Rules: required; min 1; max 3.
  WorkerState state = 1;

  WorkerResources capacity = 2;

  WorkerResources allocated = 3;

  // Latest epoch reported by the worker process.
  // Rules: min 0.
  int64 observed_epoch = 4;

  // Rules: max items 1; unique by sandbox_class.
  repeated WorkerSandboxClass sandbox_classes = 5;

  // Rules: max items 2; custom checks.
  repeated string ips = 6;

  // Latest epoch handed out by AcquireWorkerEpoch.
  // Rules: min 0.
  int64 issued_epoch = 7;

  // Epoch the current worker process registered with.
  // Rules: min 0.
  int64 registered_epoch = 8;
}

// A sandbox class a Worker runs and the runtimes it offers for it.
message WorkerSandboxClass {
  // Rules: required; max length 63; custom checks.
  string sandbox_class = 1;

  // Rules: required.
  WorkerSandboxRuntime default_runtime = 2;

  // Rules: max items 32.
  repeated WorkerSandboxRuntime restorable_runtimes = 3;
}

// One runtime a Worker offers for a sandbox class.
message WorkerSandboxRuntime {
  // Rules: required.
  VersionedSandboxCompat version = 1;

  RuntimeOverhead actor_overhead = 2;

}

// Memory an Actor uses beyond its own limit: a fixed part plus a part per GiB of limit.
message RuntimeOverhead {
  // Rules: min 0; max 1099511627776.
  int64 memory_bytes = 1;

  // Rules: min 0; max 1073741824.
  int64 memory_bytes_per_gib = 2;
}

// Runtime an Actor runs under, as stamped on assignments and snapshots.
message ActorSandboxRuntime {
  // Rules: required; max length 63; custom checks.
  string sandbox_class = 1;

  // Rules: required.
  VersionedSandboxCompat version = 2;

}

// Compatibility schema version plus attributes of a sandbox runtime.
message VersionedSandboxCompat {
  // Rules: required; max length 64.
  string schema_version = 1;

  // Rules: required; max items 32; unique by key.
  repeated AttributeEntry attributes = 2;
}

// One compatibility attribute.
message AttributeEntry {
  // Rules: required; max length 128.
  string key = 1;

  // Rules: required; max length 256.
  string value = 2;
}

// Capacity or allocation of a Worker.
message WorkerResources {
  // Rules: min 0; max 999999.
  int64 cpu_millicores = 1;

  // Rules: min 0.
  int64 memory_bytes = 2;

  // Number of Actors.
  // Rules: min 1.
  int32 actors = 3;
}

// Binding of an Actor to a Worker; a sub-resource of the Worker.
message ActorAssignment {
  option (resource) = {
    parents : "Worker"
    plural : "ActorAssignments"
  };

  // Rules: required; hive forbidden.
  ResourceMetadata metadata = 1;

  // Rules: required; hive required.
  ObjectRef actor = 2;

  // Rules: required; uuid.
  string actor_uid = 3;

  Resources resources = 4;
}

// WorkerService is how keepers report what their workers observe. It is separate from
// Control because only keepers may call it, and only for workers on their own node.
service WorkerService {
  // Hands out a fresh epoch for a starting worker process.
  rpc AcquireWorkerEpoch(AcquireWorkerEpochRequest) returns (AcquireWorkerEpochResponse);

  // Activates an acquired epoch and records the worker's IPs and capacity.
  rpc RegisterWorker(RegisterWorkerRequest) returns (RegisterWorkerResponse);

  // Records the sandbox runtimes a worker can run.
  rpc SetWorkerSandboxRuntimes(SetWorkerSandboxRuntimesRequest) returns (SetWorkerSandboxRuntimesResponse);

  // Issues a certificate for the tunnel of an Actor the calling worker hosts.
  rpc MintWorkerActorCertificate(MintWorkerActorCertificateRequest) returns (MintWorkerActorCertificateResponse);

  // Issues a JWT for an Actor the calling worker hosts.
  rpc MintWorkerActorJwt(MintWorkerActorJwtRequest) returns (MintWorkerActorJwtResponse);

  // Asks the control plane to suspend an Actor the calling worker hosts.
  rpc RequestActorSuspend(RequestActorSuspendRequest) returns (RequestActorSuspendResponse);

  // Reports the snapshots a keeper holds for an Actor.
  rpc ReportActorSnapshotState(ReportActorSnapshotStateRequest) returns (ReportActorSnapshotStateResponse);

  // Reports that an Actor's sandbox died on its own.
  rpc ReportActorCrashed(ReportActorCrashedRequest) returns (ReportActorCrashedResponse);
}

message AcquireWorkerEpochRequest {
  // Rules: required; hive forbidden.
  ObjectRef worker = 1;
}

message AcquireWorkerEpochResponse {
  int64 epoch = 1;
}

message RegisterWorkerRequest {
  // Rules: required; hive forbidden.
  ObjectRef worker = 1;

  // Rules: required; min 1.
  int64 epoch = 3;

  // Rules: required; max items 2; custom checks.
  repeated string ips = 4;

  // Rules: required.
  WorkerResources capacity = 2;
}

message RegisterWorkerResponse {
  Worker worker = 1;
}

message SetWorkerSandboxRuntimesRequest {
  // Rules: required; hive forbidden.
  ObjectRef worker = 1;

  // Rules: required; min 1.
  int64 epoch = 2;

  // Rules: required; min items 1; max items 1; unique by sandbox_class.
  repeated WorkerSandboxClass sandbox_classes = 3;
}

message SetWorkerSandboxRuntimesResponse {
  Worker worker = 1;
}

message MintWorkerActorCertificateRequest {
  // Rules: required; hive required.
  ObjectRef actor = 1;

  // Rules: required; uuid.
  string actor_uid = 2;

  // Rules: required; max bytes 16384.
  bytes certificate_signing_request = 3;

  // Rules: required; hive forbidden.
  ObjectRef worker = 4;
}

message MintWorkerActorCertificateResponse {
