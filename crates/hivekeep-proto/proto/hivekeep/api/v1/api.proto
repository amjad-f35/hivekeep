// Marks a message as an API resource.
message ResourceAnnotation {
  repeated string parents = 1;

  bool singleton = 2;

  Scope scope = 3;

  string plural = 4;
}

// Whether a top-level resource belongs to a Hive.
enum Scope {
  SCOPE_UNSPECIFIED = 0;
  SCOPE_HIVE = 1;
  SCOPE_GLOBAL = 2;
}

// Describes an RPC of the API.
message MethodAnnotation {
  string resource = 1;
}

extend google.protobuf.MessageOptions {
  ResourceAnnotation resource = 50000;
}

extend google.protobuf.MethodOptions {
  MethodAnnotation method = 50000;
}
