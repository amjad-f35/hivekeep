  google.protobuf.Timestamp durable_complete_time = 6;
}

// Role bindings of a parent resource (or of the whole deployment). Each parent has at
// most one, named "default".
message AccessPolicy {
  option (resource) = {
    parents : [ "Global", "Hive" ]
    singleton : true
    plural : "AccessPolicies"
  };

