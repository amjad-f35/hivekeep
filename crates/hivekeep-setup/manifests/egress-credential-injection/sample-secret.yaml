# The sample credential the policy injects. The URI in the sample policy,
#   hk-secret://k8s.io/default/ns1/example-api/token
# resolves to namespace "ns1", Secret "example-api". The URI omits a key, and the
# Secret has exactly one ("token"), so that sole key is returned. The actor's
# hive also needs a grant for "ns1" in the namespace policy; see
# docs/egress-credential-injection.md.
apiVersion: v1
kind: Namespace
metadata:
  name: ns1
---
apiVersion: v1
kind: Secret
metadata:
  name: example-api
  namespace: ns1
type: Opaque
stringData:
  token: "test-github-token"
