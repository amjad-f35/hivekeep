# Strategic-merge patch adding a Cloud SQL Auth Proxy sidecar to
# hivekeep-api. Applied by hivekeep-setup only when
# HK_API_POSTGRES_CLOUDSQL_INSTANCE is set.
#
# The proxy owns transport security (TLS 1.3 tunnel with ephemeral
# certificates and instance identity verification) and, with
# CSQL_PROXY_AUTO_IAM_AUTHN, IAM database authentication: it resolves the
# pod's Workload Identity via ADC and logs into Postgres with an OAuth token,
# so no database password exists anywhere. hivekeep-api connects to
# 127.0.0.1:5432 in plaintext that never leaves the pod's network namespace.
#
# All CSQL_PROXY_* configuration comes from the hivekeep-api-envvars
# ConfigMap (written by hivekeep-setup); the instance connection name is the
# proxy's single positional argument, expanded by Kubernetes from the same
# ConfigMap.
spec:
  template:
    spec:
      # A native sidecar: an initContainer with restartPolicy Always starts
      # (and passes its startupProbe) before the hivekeep-api container starts, and
      # keeps running for the pod's lifetime. Requires Kubernetes 1.29+.
      initContainers:
      - name: cloud-sql-proxy
        image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.26.3@sha256:f333a9c59890c3c67b8505166c5dbdcc0b29fca9173a2e09ca0446ab6997a736
        restartPolicy: Always
        args:
        - "$(HK_API_POSTGRES_CLOUDSQL_INSTANCE)"
        envFrom:
        - configMapRef:
            name: hivekeep-api-envvars
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
        # /startup returns 200 once the proxy can accept connections; gating
        # on it means hivekeep-api never races the tunnel. Health checks listen on
        # CSQL_PROXY_HTTP_PORT (9801; hivekeep-api's metrics and health servers own
        # 9090 and 9091).
        startupProbe:
          httpGet:
            path: /startup
            port: 9801
          periodSeconds: 1
          failureThreshold: 60
        livenessProbe:
          httpGet:
            path: /liveness
            port: 9801
          initialDelaySeconds: 10
          periodSeconds: 10
