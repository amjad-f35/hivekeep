apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../postgres/postgres.yaml

# The base sizes the database for a real install under activation load. On a
# kind node -- 4 vCPU and a small disk on a GitHub runner -- that would crowd
# out everything else, so restore the small test-database footprint.
patches:
  - patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: postgres
        namespace: hivekeep-system
      spec:
        template:
          spec:
            containers:
            - name: postgres
              resources:
                requests:
                  cpu: 250m
                limits:
                  cpu: "2"
  - target:
      kind: StatefulSet
      name: postgres
      namespace: hivekeep-system
    patch: |-
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage
        value: 1Gi
