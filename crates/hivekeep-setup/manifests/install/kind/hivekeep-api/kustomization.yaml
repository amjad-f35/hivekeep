apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../hivekeep-api.yaml

# OTEL_TRACES_SAMPLER pins hivekeep-api to parentbased_always_on so every API
# call it roots is traced; the other components keep their binary defaults and
# follow its sampled flag via their ParentBased samplers. It stays an inline
# patch rather than a key in hivekeep-otel-config.yaml because that ConfigMap is
# shared by every component via envFrom -- putting always_on there would pin the
# router and the control plane to 100% too, undoing their per-component ratios.
#
# The storage settings point hivekeep-api's object-store plugin at the same
# rustfs the ../keeper overlay points keeper's at: both ends of an external
# snapshot's life have to agree on where it lives.
patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: hivekeep-api
        namespace: hivekeep-system
      spec:
        template:
          spec:
            containers:
            - name: hivekeep-api
              env:
              - name: OTEL_TRACES_SAMPLER
                value: parentbased_always_on
            initContainers:
            - name: objectstore-plugin
              env:
              - name: HK_STORAGE_BACKEND
                value: s3
              - name: AWS_REGION
                value: us-east-1
              - name: AWS_ENDPOINT_URL
                value: http://rustfs.hivekeep-system.svc:9000
              - name: AWS_S3_USE_PATH_STYLE
                value: "true"
              # TODO: use a secret / identity management
              - name: AWS_ACCESS_KEY_ID
                value: rustfsadmin
              - name: AWS_SECRET_ACCESS_KEY
                value: rustfsadmin
