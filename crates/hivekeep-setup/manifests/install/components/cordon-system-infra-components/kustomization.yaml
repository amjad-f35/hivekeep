# Keeps the system infra components off the worker nodes. Selected by
# hivekeep-setup under --cordon-system-infra-components, which wraps every
# system infra apply in a kustomization that includes this component.
#
# Assumes two node pools, each carrying its label as a matching NoSchedule
# taint:
#
#   hivekeep.io/workloadType=hivekeep-system-infra  A small pool shared by every
#       system infra workload except postgres. Each workload's replicas are
#       spread across its nodes on a best-effort basis, so the pool may be
#       smaller than the pod count and rollout surges never wait on a free
#       node.
#   hivekeep.io/workloadType=hivekeep-postgres  One node, postgres alone. The
#       StatefulSet replaces its pod in place, so no spare is needed.
#
# A pool that is missing leaves its pods Pending rather than failing loudly.
#
# Name-regex targets rather than one patch per workload: the install applies
# these workloads through several different streams (the base bundle, a lone
# hivekeep-api redeploy, the podcert overlay, the postgres file, the egress
# variants, and the bundled credential provider), and kustomize leaves a stream
# alone when nothing in it matches, so the same component fits every path.

apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

patches:
  - target:
      kind: Deployment
      name: hivekeep-api|hivekeep-idp-server|hivekeep-controller|gate-router|gate-egress|podcertificate-controller|k8s-credential-provider|fake-workersync
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: overridden-by-target
      spec:
        template:
          metadata:
            labels:
              hivekeep.io/workloadType: hivekeep-system-infra
          spec:
            nodeSelector:
              hivekeep.io/workloadType: hivekeep-system-infra
            tolerations:
            - key: hivekeep.io/workloadType
              operator: Equal
              value: hivekeep-system-infra
              effect: NoSchedule
            topologySpreadConstraints:
            # matchLabelKeys narrows the selector to pods sharing this pod's
            # app label, so each workload spreads its own replicas.
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: ScheduleAnyway
              labelSelector:
                matchLabels:
                  hivekeep.io/workloadType: hivekeep-system-infra
              matchLabelKeys:
              - app
  - target:
      kind: StatefulSet
      name: postgres
    patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: overridden-by-target
      spec:
        template:
          spec:
            nodeSelector:
              hivekeep.io/workloadType: hivekeep-postgres
            tolerations:
            - key: hivekeep.io/workloadType
              operator: Equal
              value: hivekeep-postgres
              effect: NoSchedule
