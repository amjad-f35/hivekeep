# Single source of truth for the OTLP exporter settings shared by every control
# plane component (hivekeep-api, hivekeep-controller, keeper, gate-router,
# gate-egress), which consume it via `envFrom`. hivekeep-controller additionally propagates these values
# to the worker pods it creates, which have no other way to receive them,
# and gate-router's --otlp-collector-address defaults to the endpoint below,
# so Envoy's own spans follow it too. The exporter selection is the exception:
# worker takes HK_WORKER_OTEL_LOGS_EXPORTER, HK_WORKER_OTEL_TRACES_EXPORTER
# and HK_WORKER_OTEL_METRICS_EXPORTER, not the control plane's
# OTEL_*_EXPORTER values.
#
# This file holds the GKE values. The kind overlay supplies a ConfigMap of the
# same name with the in-cluster collector address; see
# manifests/install/kind/hivekeep-otel-config.yaml.
#
# NOTE: editing this ConfigMap does not restart the pods that consume it — the
# pod template is unchanged, so no new rollout is triggered. Follow a change
# with `kubectl rollout restart` on the affected workloads.
apiVersion: v1
kind: ConfigMap
metadata:
  name: hivekeep-otel-config
  namespace: hivekeep-system
data:
  OTEL_EXPORTER_OTLP_ENDPOINT: http://opentelemetry-collector.gke-managed-otel.svc.cluster.local:4317
