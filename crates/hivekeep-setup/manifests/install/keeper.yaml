# 1. Create Service Account
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hivekeep-keeper
  namespace: hivekeep-system
---
# 2. Define Permissions
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: keeper
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "watch", "list"]
- apiGroups: ["hivekeep.io"]
  resources: ["csidriverconfigs"]
  verbs: ["get", "list", "watch"]
# SandboxConfigs are watched to pre-download sandbox assets into the node's
# cache before the first actor needs them,
# and to write the runtimes of the configs local workers use to each worker's
# sandbox runtimes file.
- apiGroups: ["hivekeep.io"]
  resources: ["sandboxconfigs"]
  verbs: ["get", "list", "watch"]
# WorkerPools are watched to find the SandboxConfig each local worker's pool
# uses, whose versions keeper writes to the worker's sandbox runtimes file.
- apiGroups: ["hivekeep.io"]
  resources: ["workerpools"]
  verbs: ["get", "list", "watch"]
# Sync failures are reported as Warning Events on the worker pod.
- apiGroups: ["events.k8s.io"]
  resources: ["events"]
  verbs: ["create", "patch"]
# ClusterTrustBundles referenced by SystemInfo trustBundle data sources are
# resolved on the node: keeper reads them through an informer and projects
# the sanitized PEM into actors.
- apiGroups: ["certificates.k8s.io"]
  resources: ["clustertrustbundles"]
  verbs: ["get", "watch", "list"]
---
# 3. Bind Identity to Permissions
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: keeper
subjects:
- kind: ServiceAccount
  name: hivekeep-keeper
  namespace: hivekeep-system
roleRef:
  kind: ClusterRole
  name: keeper
  apiGroup: rbac.authorization.k8s.io
---
# 4. Namespaced Role for EndpointSlices
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: keeper-endpointslices
  namespace: hivekeep-system
rules:
- apiGroups: ["discovery.k8s.io"]
  resources: ["endpointslices"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: keeper-endpointslices
  namespace: hivekeep-system
subjects:
- kind: ServiceAccount
  name: hivekeep-keeper
  namespace: hivekeep-system
roleRef:
  kind: Role
  name: keeper-endpointslices
  apiGroup: rbac.authorization.k8s.io
---
# 5. Create PriorityClass
# Prioritize keeper over workers, which need it for actor activation.
# Use the highest user-defined priority; system-node-critical requires kube-system.
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: hivekeep-node-critical
value: 1000000000
globalDefault: false
description: "Node-local hivekeep components that every actor activation depends on."

---
# 6. Create DaemonSet
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: keeper
  namespace: hivekeep-system
  labels:
    app: keeper
spec:
  selector:
    matchLabels:
      app: keeper
  template:
    metadata:
      labels:
        app: keeper
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      serviceAccountName: hivekeep-keeper
      priorityClassName: hivekeep-node-critical
      # Budget for the full shutdown sequence: --drain-delay (0 for keeper) +
      # --drain-timeout (5m). Sized long because Checkpoint/Restore stream
      # multi-GiB snapshots and must not be force-cancelled mid-upload. The sum
      # must fit within terminationGracePeriodSeconds, plus slack for the force
      # Stop() and the tracer/meter flush on exit.
      terminationGracePeriodSeconds: 330
      # keeper must run on every node a WorkerPool actor may schedule to.
      # Node pools reserved for one sandbox class are tainted
      # hivekeep.io/sandboxClass=<class>:NoSchedule per the convention in
      # the controller's WorkerPool reconciler (controllers/workerpool_apply.rs), which adds
      # the matching toleration to every pool's worker pods. Tolerating the key
      # with operator: Exists covers any current or future sandbox class value
      # without needing another manifest edit.
      tolerations:
      - key: hivekeep.io/sandboxClass
        operator: Exists
        effect: NoSchedule
      # GKE taints the nodes it creates for a ComputeClass with
      # cloud.google.com/compute-class=<class>:NoSchedule and adds the matching
      # toleration to pods that select the class, so a WorkerPool whose
      # template.nodeSelector selects a ComputeClass runs its workers on those
      # nodes.
      # TODO: move this GKE-specific toleration into the GKE install
      # overlay.
      - key: cloud.google.com/compute-class
        operator: Exists
        effect: NoSchedule
      # The node object-store plugin moves external snapshots between this
      # node and object storage and fetches sandbox assets for keeper, over a
      # Unix socket in a pod-local emptyDir.
      # A native sidecar (restartPolicy: Always) starts before keeper and stops
      # after it, so uploads still in flight during keeper's drain finish.
      # keeper starts only once the startup probe sees the plugin serving.
      initContainers:
      - name: objectstore-plugin
        image: REGISTRY_PLACEHOLDER/hivekeep-objectstore-plugin:0.1.0
        restartPolicy: Always
        args:
        - node
        - --socket=/run/objectstore-plugin/node.sock
        - --root=/var/lib/hivekeep
        - --asset-staging-dir=/var/lib/objectstore-plugin/asset-staging
        # keeper's 8 GiB per-asset cap, so any asset fits. Each download
        # reserves its object's size; ones past the capacity wait their turn,
        # so the asset-staging volume below never fills up.
        - --asset-staging-capacity=8Gi
        # The plugin listens on a Unix socket, which a gRPC probe cannot
        # reach, and the image has no shell, so the binary checks itself.
        startupProbe:
          exec:
            command:
            - /usr/local/bin/hivekeep-objectstore-plugin
            - healthcheck
            - --socket=/run/objectstore-plugin/node.sock
          periodSeconds: 2
          failureThreshold: 30
        # Reads and writes snapshot and asset files under the /var/lib/hivekeep
        # hostPath as root, like keeper; needs no capabilities.
        securityContext:
          allowPrivilegeEscalation: false
          runAsUser: 0
          runAsGroup: 0
          capabilities:
            drop:
            - ALL
        # Same reservation as keeper and no limits: the plugin now does the
        # zstd work keeper used to, and must not get less CPU for it.
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
        env:
        # Object storage settings for snapshot transfers and sandbox assets.
        # Unset or "gcs" selects GCS with ambient credentials; "s3" with the
        # AWS_* variables selects S3 (see the kind overlay). keeper has no
        # storage settings of its own and exits if HK_STORAGE_BACKEND is set
        # on it.
        - name: HK_STORAGE_BACKEND
          value: "gcs"
        # On GCS each transfer runs on a token scoped to its actor, from the
        # credential exchange the control sidecar serves on the hivekeep-api
        # Service. The plugin derives the exchange's address and certificate
        # name from the pod's namespace, and verifies the certificate with the
        # service DNS trust bundle mounted below. S3 never calls it.
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        envFrom:
        - configMapRef:
            name: hivekeep-otel-config
        volumeMounts:
        # HostToContainer so we also see mounts made under /var/lib/hivekeep after
        # the pod starts, e.g. a snapshots disk or CSI volumes.
        - name: hivekeep-base
          mountPath: /var/lib/hivekeep
          mountPropagation: HostToContainer
        - name: objectstore-plugin
          mountPath: /run/objectstore-plugin
        - name: servicedns-ca
          mountPath: /run/servicedns.podcert.hivekeep.io
          readOnly: true
        # Sandbox assets are downloaded here and verified against their sha256
        # before the plugin copies them below /var/lib/hivekeep. Only this container
        # mounts it, so keeper never sees bytes it did not pin.
        - name: asset-staging
          mountPath: /var/lib/objectstore-plugin/asset-staging
      containers:
      - name: keeper
        image: REGISTRY_PLACEHOLDER/hivekeep-keeper:0.1.0
        args:
        # Pull credentials come from the node's own kubelet credential provider
        # plugin (mounted read-only below) rather than a cloud SDK compiled into
        # keeper, so the same keeper authenticates to Artifact Registry on GKE
        # and to ECR on EKS.
        - --image-credential-provider-config=/run/image-credential-provider/config.yaml
        - --image-credential-provider-bin-dir=/run/image-credential-provider/bin
        - --grpc-server-cred-bundle=/run/podidentity.podcert.hivekeep.io/credential-bundle.pem
        - --client-ca-certs=/run/podidentity.podcert.hivekeep.io/trust-bundle.pem
        - --api-ca-file=/run/servicedns.podcert.hivekeep.io/trust-bundle.pem
        # Graceful shutdown knobs. The sum must fit within
        # terminationGracePeriodSeconds above.
        - --drain-delay=0s
        - --drain-timeout=5m
        - --objectstore-plugin-socket=/run/objectstore-plugin/node.sock
        # keeper does no mounts, netlink, device, or namespace operations (those
        # live in the worker pod) — it only reads/writes the
        # /var/lib/hivekeep hostPath as root. CAP_DAC_OVERRIDE is for one thing:
        # emptying a directory a non-root actor created in its 0777 durable dir.
        # It is owned by the actor's uid, typically 0755, so root has no write
        # access to it and resetActorDirs fails after every checkpoint.
        # runAsUser is pinned explicitly rather than relying on the base image's
        # default user.
        securityContext:
          allowPrivilegeEscalation: false
          runAsUser: 0
          runAsGroup: 0
          capabilities:
            drop:
            - ALL
            add:
            - DAC_OVERRIDE
        # Keep per-node reservations small; omit limits to allow usage to grow
        # with the number of hosted actors.
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: k8s.namespace.name=$(POD_NAMESPACE),k8s.pod.name=$(POD_NAME),k8s.pod.uid=$(POD_UID),k8s.node.name=$(NODE_NAME),service.instance.id=$(POD_UID)
        # OTLP exporter settings are shared by every control plane component;
        # see manifests/install/hivekeep-otel-config.yaml.
        envFrom:
        - configMapRef:
            name: hivekeep-otel-config
        ports:
        - name: grpc
          containerPort: 21998
        - name: prometheus
          containerPort: 9090
          protocol: TCP
        - name: health
          containerPort: 9091
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
          initialDelaySeconds: 5
          periodSeconds: 2
          failureThreshold: 3
        # /healthz stays 200 while a terminating pod drains; /readyz turns 503,
        # so liveness and readiness diverge correctly during shutdown.
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          initialDelaySeconds: 10
          periodSeconds: 10
        volumeMounts:
        # HostToContainer so we also see mounts made under /var/lib/hivekeep after
        # the pod starts, e.g. a snapshots disk or CSI volumes.
        - name: hivekeep-base
          mountPath: /var/lib/hivekeep
          mountPropagation: HostToContainer
        - name: objectstore-plugin
          mountPath: /run/objectstore-plugin
        - name: podidentity
          mountPath: /run/podidentity.podcert.hivekeep.io
        - name: servicedns-ca
          mountPath: /run/servicedns.podcert.hivekeep.io
          readOnly: true
        - name: kubelet-plugins
          mountPath: /var/lib/kubelet/plugins
        - name: device-plugins
          mountPath: /var/lib/kubelet/device-plugins
        - name: host-dev
          mountPath: /host/dev
          readOnly: true
        - name: image-credential-provider-bin
          mountPath: /run/image-credential-provider/bin
          readOnly: true
        - name: image-credential-provider-config
          mountPath: /run/image-credential-provider/config.yaml
          readOnly: true
      volumes:
      - name: objectstore-plugin
        emptyDir: {}
      # Holds asset downloads until they are verified. The plugin keeps them
      # within --asset-staging-capacity; the limit adds 1Gi for filesystem
      # overhead, since kubelet evicts the pod if the volume exceeds it.
      - name: asset-staging
        emptyDir:
          sizeLimit: 9Gi
      - name: hivekeep-base
        hostPath:
          path: /var/lib/hivekeep
          type: DirectoryOrCreate
      # Mount Kubelet plugins directory to access CSI driver Unix domain sockets.
      - name: kubelet-plugins
        hostPath:
          path: /var/lib/kubelet/plugins
          type: DirectoryOrCreate
      # keeper advertises host devices (e.g. /dev/kvm) to kubelet as extended
      # resources so worker pods can be granted just those devices instead of
      # running privileged. Registering requires talking to kubelet's socket in
      # this directory and creating a plugin socket beside it.
      - name: device-plugins
        hostPath:
          path: /var/lib/kubelet/device-plugins
          type: DirectoryOrCreate
      # Read-only view of the node's device nodes, used only to detect which
      # ones exist (keeper's own /dev is the container's, and does not show
      # /dev/kvm). Detection is all this grants: keeper drops every capability
      # and its own cgroup device filter still denies opening these.
      - name: host-dev
        hostPath:
          path: /dev
          type: Directory
      # The kubelet's own credential provider bin dir and config; these paths
      # are GKE's, other node distributions differ. The bin dir also holds the
      # node's other kubelet-installed binaries -- the plugin contract is
      # directory-scoped, so a narrower mount would have to hard-code the
      # provider name and give up being cloud-agnostic.
      - name: image-credential-provider-bin
        hostPath:
          path: /home/kubernetes/bin
          type: DirectoryOrCreate
      - name: image-credential-provider-config
        hostPath:
          path: /etc/srv/kubernetes/cri_auth_config.yaml
          type: FileOrCreate
      # Identity for mutual TLS with the hivekeep-api. keeper is not behind a
      # Service, so it uses a podidentity (SPIFFE) cert rather than a servicedns
      # serving cert (which requires DNS SANs it would not have); the
      # clusterTrustBundle verifies the apiserver's client certificate.
      - name: podidentity
        projected:
          sources:
          - podCertificate:
              signerName: podidentity.podcert.hivekeep.io/identity
              keyType: ECDSAP256
              credentialBundlePath: credential-bundle.pem
          - clusterTrustBundle:
              signerName: podidentity.podcert.hivekeep.io/identity
              labelSelector:
                matchLabels:
                  podcert.hivekeep.io/canarying: live
              path: trust-bundle.pem
      - name: servicedns-ca
        projected:
          sources:
          - clusterTrustBundle:
              signerName: servicedns.podcert.hivekeep.io/identity
              labelSelector:
                matchLabels:
                  podcert.hivekeep.io/canarying: live
              path: trust-bundle.pem
