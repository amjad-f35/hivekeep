# An in-cluster Envoy in front of the load-driver Actor. It takes plaintext
# HTTP/1.1 and HTTP/2 (h2c, gRPC) on :19980, sets
# `hk-target-actor: egress-bench/driver` on every request, and forwards it
# over mTLS to the gate router, presenting a pod identity certificate.
#
# It exists because nighthawk_client cannot add headers to its calls to a
# remote nighthawk_service; without the header the router cannot tell which
# Actor a call is for.
apiVersion: v1
kind: ConfigMap
metadata:
  name: driver-gateway
  namespace: egress-bench
data:
  envoy.yaml: |
    # SDS needs a node id and cluster.
    node:
      id: driver-gateway
      cluster: driver-gateway

    static_resources:
      listeners:
      - name: driver_19980
        address:
          socket_address:
            address: "::"
            ipv4_compat: true
            port_value: 19980
        listener_filters:
        - name: envoy.filters.listener.http_inspector
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.listener.http_inspector.v3.HttpInspector
        filter_chains:
        - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: driver_19980
              codec_type: AUTO
              route_config:
                name: to_driver
                request_headers_to_add:
                - header:
                    key: hk-target-actor
                    value: egress-bench/driver
                  append_action: OVERWRITE_IF_EXISTS_OR_ADD
                virtual_hosts:
                - name: gate_router
                  domains: ["*"]
                  routes:
                  - match:
                      prefix: "/"
                    route:
                      cluster: gate_router
                      # Test executions stream for their whole duration.
                      timeout: 0s
              http_filters:
              - name: envoy.filters.http.router
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

      clusters:
      - name: gate_router
        type: STRICT_DNS
        connect_timeout: 5s
        typed_extension_protocol_options:
          envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
            "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
            # Upstream speaks whatever the client spoke: HTTP/2 for gRPC.
            use_downstream_protocol_config:
              http_protocol_options: {}
              http2_protocol_options: {}
        transport_socket:
          name: envoy.transport_sockets.tls
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
            sni: gate-router.hivekeep-system.svc
            common_tls_context:
              tls_certificate_sds_secret_configs:
              - name: podidentity_client_cert
                sds_config:
                  resource_api_version: V3
                  path_config_source:
                    path: /etc/envoy/sds-podidentity-cert.yaml
              combined_validation_context:
                default_validation_context:
                  match_typed_subject_alt_names:
                  - san_type: DNS
                    matcher:
                      exact: gate-router.hivekeep-system.svc
                validation_context_sds_secret_config:
                  name: servicedns_validation_context
                  sds_config:
                    resource_api_version: V3
                    path_config_source:
                      path: /etc/envoy/sds-servicedns-validation.yaml
        load_assignment:
          cluster_name: gate_router
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: gate-router.hivekeep-system.svc.cluster.local
                    port_value: 443
  sds-podidentity-cert.yaml: |
    resources:
    - "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.Secret
      name: podidentity_client_cert
      tls_certificate:
        certificate_chain: { filename: /run/podidentity.podcert.hivekeep.io/credential-bundle.pem }
        private_key: { filename: /run/podidentity.podcert.hivekeep.io/credential-bundle.pem }
        watched_directory: { path: /run/podidentity.podcert.hivekeep.io }
  sds-servicedns-validation.yaml: |
    resources:
    - "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.Secret
      name: servicedns_validation_context
      validation_context:
        trusted_ca: { filename: /run/servicedns.podcert.hivekeep.io/trust-bundle.pem }
        watched_directory: { path: /run/servicedns.podcert.hivekeep.io }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: driver-gateway
  namespace: egress-bench
  labels:
    app: driver-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: driver-gateway
  template:
    metadata:
      labels:
        app: driver-gateway
    spec:
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        fsGroup: 65532
      containers:
      - name: envoy
        # The Envoy pin hivekeep-setup uses for the CSI proxy.
        image: envoyproxy/envoy:v1.39.5@sha256:8fc594a5d85eb76dca24155cfb9208882406873932b20cf33649a0a611194c43
        command:
        - /usr/local/bin/envoy
        args:
        - -c
        - /etc/envoy/envoy.yaml
        - --concurrency
        - "1"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        ports:
        - name: http
          containerPort: 19980
          protocol: TCP
        readinessProbe:
          tcpSocket:
            port: http
          periodSeconds: 5
        volumeMounts:
        - name: config
          mountPath: /etc/envoy
          readOnly: true
        - name: podidentity
          mountPath: /run/podidentity.podcert.hivekeep.io
          readOnly: true
        - name: servicedns
          mountPath: /run/servicedns.podcert.hivekeep.io
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: driver-gateway
      - name: podidentity
        projected:
          sources:
          - podCertificate:
              signerName: podidentity.podcert.hivekeep.io/identity
              keyType: ECDSAP256
              credentialBundlePath: credential-bundle.pem
      - name: servicedns
        projected:
          sources:
          - clusterTrustBundle:
              signerName: servicedns.podcert.hivekeep.io/identity
              labelSelector:
                matchLabels:
                  podcert.hivekeep.io/canarying: live
              path: trust-bundle.pem
---
apiVersion: v1
kind: Service
metadata:
  name: driver-gateway
  namespace: egress-bench
spec:
  type: ClusterIP
  ipFamilyPolicy: PreferDualStack
  selector:
    app: driver-gateway
  ports:
  - name: http
    port: 19980
    targetPort: http
    protocol: TCP
