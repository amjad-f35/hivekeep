[package]
name = "hivekeep-bench"
description = "Hivekeep load and benchmark tooling: the glutton workload, the locust load generator, the egress benchmark and the fake data plane."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "hivekeep_bench"
path = "src/lib.rs"

[features]
default = []

[[bin]]
name = "glutton"
path = "src/bin/glutton.rs"

[[bin]]
name = "locust-worker"
path = "src/bin/locust_worker.rs"

[[bin]]
name = "egress-bench"
path = "src/bin/egress_bench.rs"

[[bin]]
name = "fake-keeper"
path = "src/bin/fake_keeper.rs"

[[bin]]
name = "fake-workersync"
path = "src/bin/fake_workersync.rs"

[dependencies]
hivekeep-telemetry = { workspace = true }
hivekeep-core = { workspace = true }
hivekeep-identity = { workspace = true }
hivekeep-proto = { workspace = true }
hivekeep-k8s = { workspace = true }

anyhow = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
futures = { workspace = true }
hex = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true }
humantime = { workspace = true }
object_store = { workspace = true, features = ["aws", "gcp"] }
hyper = { workspace = true }
hyper-util = { workspace = true }
parking_lot = { workspace = true }
prometheus = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }
rand = { workspace = true }
rcgen = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true }
rmpv = { workspace = true }
rustls = { workspace = true }
rustls-pemfile = { workspace = true }
rustls-native-certs = { workspace = true }
time = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-rustls = { workspace = true }
tokio-stream = { workspace = true }
tokio-util = { workspace = true }
tonic = { workspace = true, features = ["tls-ring"] }
tonic-prost = { workspace = true }
tower = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
x509-parser = { workspace = true }
zeromq = { workspace = true }

k8s-openapi = { workspace = true }
kube = { workspace = true, features = ["runtime"] }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[build-dependencies]
tonic-prost-build = { workspace = true }

[dev-dependencies]
hivekeep-k8s = { workspace = true, features = ["testing"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
