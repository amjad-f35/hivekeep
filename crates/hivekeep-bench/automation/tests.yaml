# The benchmark list the orchestrator runs, one entry at a time. Hivekeep and
# the benchmark workloads are installed before each entry and removed after
# it, so no entry sees another's state.
#
# Fields every entry may set:
#
#   type           Required. The runner: "locust" or "nighthawk-ingress";
#                  each type's own fields are described below.
#   targetCluster  Required. Names a settings file in
#                  /etc/orchestrator/target-clusters/ (targetCluster: dev
#                  reads dev.sh). The orchestrator installs it as the clone's
#                  .hivekeep-dev-env.sh for the entry and removes it after,
#                  so entries can target different clusters and projects
#                  within one scheduled run.
#   sandboxClass   Optional, default "gvisor". Sandbox runtime of the
#                  benchmark WorkerPool: "gvisor" or "microvm".
#   workerCount    Optional, default 1. WorkerPool replicas for this entry;
#                  every entry redeploys the workloads, so each picks its own
#                  scale.
#   actorMemory    Optional, default "256Mi". Memory limit of the benchmark
#                  ActorTemplates; raise it for suites that fill glutton's
#                  RAM.
#   actorCPU       Optional, default "1". CPU limit of the benchmark
#                  ActorTemplates. The scheduler books it against each
#                  worker's CPU, so it caps how many Actors a worker hosts at
#                  once; lower it for dense suites.
#   workerMemory   Optional, default unset (worker pods have no requests or
#                  limits). Memory request and limit of each worker pod. Use
#                  it to fix how many workers share a node: one per node needs
#                  more than half the node's allocatable memory. The limit,
#                  less what the worker keeps for itself, is the Actor
#                  capacity it reports.
#   workerWaitTimeout
#                  Optional, default 300 (workloads/deploy.sh's). Whole
#                  seconds to wait for the worker pods and templates; raise it
#                  for large fleets whose image pulls or scheduling take
#                  longer.
#   installArgs    Optional. Strings appended as they are to
#                  `scripts/install/hivekeep.sh deploy hivekeep-system`, e.g.
#                  ["--cordon-system-infra-components"]. The install needs a
#                  credential provider: give one here as a single string,
#                  '--credential-provider={"name":"k8s.io"}' (no shell quoting,
#                  the arguments bypass the shell), or as
#                  HK_CREDENTIAL_PROVIDER in the target cluster's settings.
#   isolate        Optional. Installs Hivekeep with the fake data plane
#                  (--fake-data-plane): no worker pods; the fake keeper takes
#                  the keeper's place on every keeper node and answers each
#                  lifecycle call after a delay, and fake-workersync serves the
#                  pool with workerCount fake Workers reporting the capacity a
#                  real worker would. hivekeep-api and Postgres can then be
#                  pushed past what real nodes can restore. The keys tune the
#                  fake keeper through workloads/deploy.sh --fake-keeper-env:
#                  delay (default 0s); delayRun, delayRestore,
#                  delayCheckpoint, delayPromoteSnapshot and delayTerminate,
#                  each overriding delay for one call; and
#                  mintActorCertificate (default true). A bare `isolate:`
#                  takes every default. Actors do not exist on the fake data
#                  plane, so the entry's load class must send them no
#                  requests.
#
# ---- type: locust -----------------------------------------------------------
#
# Runs `runner.py -f <file> -t <duration> -u <users> --name <name>` in a Job,
# with --tag set to the commit under test and --dest from the orchestrator.
# `file`, `duration` and `users` are required. `flags` (optional) is a list of
# strings appended to runner.py's arguments; runner.py hands what it does not
# know to locust and the load generator.
#
# `runnerCpu` (default "500m") and `runnerMemory` (default "512Mi") are the
# runner pod's requests, with no limits, so it lands on a node with that much
# free and may burst past it. Raise them for classes run at thousands of
# users: agentsession keeps one task per session and a large ingest payload
# per call in flight, so 1000+ sessions want about 4 CPUs and 8Gi.
#
# `file` is one path or a comma-separated list that locust reads as one test:
# the test first, then any load shapes (locust/shapes/). A shape changes the
# load while the run goes on.
#
# `--ladder users:duration[:trace_probability],...` with
# /app/shapes/ladder_shape.py in `file` makes a sweep a single run. The shape
# owns the load and the end of the run, so locust ignores `-t` and `users` is
# only the count before the first step. Keep `duration` at the steps' total:
# the orchestrator sizes the Job timeout from it.
#
# A step that names a trace probability changes the sampling rate when it
# starts, and the rate holds until another step changes it;
# `--trace-probability` in `flags` is the rate before the first such step.
#
# A step may end in `@target_rps` (e.g. `200:3m@4000`), capping the whole
# load generator's requests per second from the step's start; 0 lifts the
# cap. Self-pacing classes (resumepaused) honor it. Keep `users` at or above
# the rate times one iteration's p99 in seconds, or the step falls short; a
# resumepaused iteration is a resume plus a pause.
#
# `controlPlane:` (optional) shapes the control plane for a capacity run;
# pre_test applies it after the install. Its required `apiServer:` section
# sizes hivekeep-api:
#   cpu            Required. CPU request and limit of each replica (e.g. 2
#                  or "1500m").
#   memory         Optional. Memory request and limit of each replica.
#   replicas       Optional.
#   poolMaxConns   Optional. Postgres pool size per replica, set through the
#                  API's env ConfigMap.
# An optional knob left out keeps the installed value. The optional
# `postgres:` section:
#   stats          Optional, default true. Loads pg_stat_statements and adds
#                  a postgres_exporter sidecar.
#   args           Optional. Postgres settings as name=value (e.g.
#                  commit_delay=100), applied in the restart stats makes.
# Placement stays the install's: a capacity run sets
# --cordon-system-infra-components in installArgs, which keeps hivekeep-api
# and Postgres on the tainted pools that flag expects, off the load's nodes.
#
# ---- type: nighthawk-ingress ------------------------------------------------
#
# The adaptive gate router capacity benchmark. `duration` is only the Job
# wait budget; the knobs live in a `nighthawk-ingress:` block, listed in the
# "Configuration knobs" table of nighthawk-ingress/README.md. `workerCount` is
# required: the benchmark warms one Actor per worker, so it is also the Actor
# fleet size.

tests:
  - name: glutton_baseline_1_user
    type: locust
    description: "Glutton baseline: 1 concurrent user for 1 minute"
    targetCluster: dev
    file: /app/tests/glutton.py
    duration: 1m
    users: 1
    workerCount: 1
    flags:
      - "--lifecycle-mode"
      - "sync"
      - "--min-wait-time"
      - "1.0"
      - "--max-wait-time"
      - "1.0"
  - name: glutton_baseline_1_user_pause
    type: locust
    description: "Glutton baseline (pause): 1 concurrent user for 1 minute"
    targetCluster: dev
    file: /app/tests/glutton.py
    duration: 1m
    users: 1
    workerCount: 1
    flags:
      - "--lifecycle-mode"
      - "async"
      - "--min-wait-time"
      - "1.0"
      - "--max-wait-time"
      - "1.0"
  # Large-memory variants of the 1-user baseline: before the first suspend
  # the GluttonUser fills the Actor's RAM to --mem-target through glutton's
  # WriteRAM call, so every suspend/resume cycle runs against a full-sized
  # Actor. actorMemory is the target plus headroom for glutton and the
  # guest. The golden snapshot and the cold boot stay small; the working set
  # exists from the first fill on. --mem-churn rewrites 64Mi per cycle
  # through a moving window, so successive suspends snapshot changed memory
  # and the dirty window travels across the array. --mem-read touches every
  # page of the working set right after each resume, so under a
  # demand-paged restore the GluttonReadRAM row is the cost of paging the
  # previous snapshot back in.
  - name: glutton_mem_1gi_gvisor
    type: locust
    description: "Large-memory: 1Gi resident working set, gvisor"
    targetCluster: dev
    file: /app/tests/glutton.py
    duration: 1m
    users: 1
    workerCount: 1
    actorMemory: "1536Mi"
    flags:
      - "--lifecycle-mode"
      - "sync"
      - "--mem-target"
      - "1Gi"
      - "--mem-churn"
      - "64Mi"
      - "--mem-read"
      - "all"
      - "--min-wait-time"
      - "1.0"
      - "--max-wait-time"
