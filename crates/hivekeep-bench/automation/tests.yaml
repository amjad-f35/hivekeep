  # The cold resume ceiling of hivekeep-api and Postgres, on the fake data
  # plane. Each user owns one Actor: its first iteration creates it and
  # leaves it cold, in the step that adds the user, and every later
  # iteration resumes and pauses it again. The fake keeper answers every
  # call, restore and checkpoint alike, after 150 ms on every keeper node, so
  # a cycle spends 300 ms in the data plane, plus the Actor certificate mint
  # on each restore. The 200 fake Workers take 1000 Actors each, and at 10m
  # CPU an Actor books almost nothing of a Worker's CPU (a fake Worker
  # reports its node's allocatable), so placement never binds. The
  # resumepaused class sends the Actors no requests, which the fake data
  # plane requires.
  - name: api_cold_resume_pause_fake_2cpu
    type: locust
    description: "hivekeep-api cold resume on the fake data plane, hivekeep-api at 2 CPUs: rate ladder 100-1500 cold resumes/s"
    targetCluster: dev
    file: /app/tests/resumepaused.py,/app/shapes/ladder_shape.py
    duration: 23m
    users: 1000
    workerCount: 200
    actorCPU: "10m"
    runnerCpu: "8"
    runnerMemory: "2Gi"
    isolate:
      delay: 150ms
    installArgs:
      - "--cordon-system-infra-components"
    controlPlane:
      apiServer:
        replicas: 1
        cpu: 2
        memory: 4Gi
        poolMaxConns: 64
    flags:
      - "--ladder-spawn-rate"
