# An always-on personal assistant: one gateway process per user that answers
# chat messages, runs a heartbeat turn every 30 minutes while the user is
# awake, fires scheduled jobs and consolidates its memory overnight. One lap
# is one day, midnight to midnight, in real time: each think gap is the real
# idle time before the event, so run it with a fractional
# --agentsession-think-scale (0.02 plays a day in about 30 minutes). Steps
# are named by time of day; heartbeats are left out of half hours where the
# user is active.
#
# What a step stands for comes from profiling such a gateway (syscalls and
# resident memory) while a scripted model drove it:
#
#   - The gateway sits around 1.2 GiB resident after start and 1.45 to
#     1.54 GiB after one conversation. That is the 640Mi gateway_heap plus
#     growth from catalog refreshes, a resident browser and the nightly
#     sweep.
#   - A chat turn reads 5 to 7 MiB of its session database, sends a 50 to
#     110 KiB model request (read_disk_data of context_window, so the bytes
#     leave the sandbox through the router), waits on the model and appends
#     1 to 4 MiB of log. Profiled cost was 0.6 to 1.0 CPU-seconds; profiling
#     inflates syscall-heavy code 1.5 to 3x, so the script burns 0.5 s. A
#     tool-loop turn (memory search with embeddings) reads 36 MiB, writes
#     9.6 MiB and makes three model calls. A heartbeat is a chat turn with
#     no user.
#   - The model round trip is wall time with the Actor resident and idle:
#     dwell. The profiled model answered instantly, so dwell values are
#     typical field latencies (3 to 15 s a call, longer for compaction and
#     the nightly sweep), not measurements.
#   - Day shape: about 30 user messages in 7 clusters, 26 heartbeats, 15
#     hourly system events folded into the on-the-hour heartbeats, one
#     morning briefing, four catalog refreshes, one context compaction and
#     one nightly memory sweep. Autonomous turns outnumber user turns.
#
# Per lap: 61 wakes, about 65 CPU-seconds, about 440 s resident and idle,
# about 150 MiB written and 11 MiB ingested. Declared RAM is 960Mi plus
# about 120Mi of files; the 1536Mi floor leaves the guest the headroom the
# coding script showed it needs.

name: personal-assistant
min_actor_memory: 1536Mi
steps:
  - name: 0000_gateway_start
    agent: "Gateway starts: loads config, skills and the session store, settles its heap"
    think: 55m
    ops:
      - fill_ram: {key: gateway_heap, size: 640Mi}
      - write_disk: {key: bootstrap_files, size: 32Ki}
      - write_disk: {key: context_window, size: 96Ki}
      - write_disk: {key: session_db, size: 6Mi}
      - write_disk: {key: memory_notes, size: 8Ki}
      - write_disk: {key: memory_index, size: 4Mi}
      - burn_cpu: {millis: 3000, parallel: 1}
      - ping: {}
  - name: 0300_dreaming
    agent: "Nightly memory consolidation: rereads the day, rewrites MEMORY.md, reindexes"
    think: 3h
    ops:
      - read_disk_data: {key: memory_index}
      - read_disk_digest: {key: session_db}
      - read_disk_digest: {key: bootstrap_files}
      - read_disk_digest: {key: session_db}
      - burn_cpu: {millis: 600, parallel: 1}
      - read_disk_data: {key: context_window}
      - dwell: {millis: 15000}
      - write_disk: {key: session_wal, size: 1Mi}
      - read_disk_digest: {key: bootstrap_files}
      - read_disk_digest: {key: session_db}
      - burn_cpu: {millis: 600, parallel: 1}
      - read_disk_data: {key: context_window}
      - dwell: {millis: 15000}
      - write_disk: {key: session_wal, size: 1Mi}
      - read_disk_digest: {key: bootstrap_files}
      - read_disk_digest: {key: session_db}
      - burn_cpu: {millis: 600, parallel: 1}
      - read_disk_data: {key: context_window}
      - dwell: {millis: 15000}
      - write_disk: {key: session_wal, size: 1Mi}
      - write_disk: {key: memory_notes, size: 32Ki}
      - write_disk: {key: memory_index, size: 4Mi}
      - fill_ram: {key: dream_retained, size: 96Mi}
  - name: 0505_catalog_refresh
    agent: Model catalog refresh, no model call
    think: 2h5m
    ops:
      - ingest: {key: model_catalog, size: 2Mi}
      - burn_cpu: {millis: 800, parallel: 1}
      - fill_ram: {key: catalog_cache, size: 32Mi}
  - name: 0730_morning_hello
