[package]
name = "hivekeep-e2e"
description = "End-to-end test harness, fixtures and suites for a live Hivekeep cluster."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "hivekeep_e2e"
path = "src/lib.rs"

[[bin]]
name = "hivekeep-e2e-testserver"
path = "src/bin/hivekeep-e2e-testserver.rs"

[[bin]]
name = "hivekeep-e2e-probe"
path = "src/bin/hivekeep-e2e-probe.rs"

[dependencies]
hivekeep-telemetry = { workspace = true }
hivekeep-core = { workspace = true }
hivekeep-identity = { workspace = true }
hivekeep-k8s = { workspace = true }
hivekeep-proto = { workspace = true }

anyhow = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
futures = { workspace = true }
http = { workspace = true }
humantime = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
libc = { workspace = true }
parking_lot = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }
regex = { workspace = true }
rustls = { workspace = true, features = ["ring"] }
rustls-pemfile = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-rustls = { workspace = true }
tokio-stream = { workspace = true }
tokio-util = { workspace = true }
tonic = { workspace = true, features = ["tls-ring"] }
tonic-prost = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
x509-parser = { workspace = true }

http-body-util = { workspace = true }
k8s-openapi = { workspace = true }
kube = { workspace = true, features = ["ws"] }
prost-reflect = { workspace = true }
rand = { workspace = true }
rcgen = { workspace = true, features = ["x509-parser"] }
serde_yaml_ng = { workspace = true }
tonic-health = { workspace = true }
# System trust anchors for the probe's roots=system fetches.
rustls-native-certs = { workspace = true }
# Not in the workspace table.
tokio-tungstenite = { workspace = true, features = ["connect"] }

[build-dependencies]
tonic-prost-build = { workspace = true }

[dev-dependencies]
# Suites: registry pushes, object-store requests and layer digests.
hex = { workspace = true }
reqwest = { workspace = true }
sha2 = { workspace = true }
tar = { workspace = true }
