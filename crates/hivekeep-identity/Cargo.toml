[package]
name = "hivekeep-identity"
description = "Actor and worker identity for Hivekeep: SPIFFE X.509 certificate minting, actor JWTs and trust bundles."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# Signature verification for curves jsonwebtoken does not cover (ES512).
aws-lc-rs = { workspace = true }
hivekeep-core = { workspace = true }
base64 = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
x509-parser = { workspace = true, features = ["verify-aws"] }
# aws-lc-rs backends: jsonwebtoken has no ring backend, and rcgen needs
# aws-lc-rs to generate RSA keys. With aws_lc_rs enabled rcgen prefers it
# over ring.
jsonwebtoken = { workspace = true }
rcgen = { workspace = true, features = ["aws_lc_rs", "x509-parser"] }

[dev-dependencies]
tempfile = { workspace = true }
