
syntax = "proto3";

package hivekeep.credprovider.v1;


// CredentialProvider is the plugin API a secret backend implements so Hivekeep
// infrastructure (e.g. the egress gateway's credential injector) can fetch an
// external credential without Hivekeep storing it. A provider interprets the
// attested request context however is relevant to the store it fronts.
service CredentialProvider {
  // FetchSecret resolves a credential URI to its secret material, subject to
  // whatever authorization the provider applies to the request context.
  rpc FetchSecret(FetchSecretRequest) returns (FetchSecretResponse) {}
}

// FetchSecretRequest asks a provider to resolve one credential URI.
message FetchSecretRequest {
  // The uri for the Hivekeep secret to fetch.
  // Example: hk-secret://<provider name>/<provider tail>
  // The provider tail is provider-interpreted.
  string uri = 1;

  // The SPIFFE ID of the actor on whose behalf the secret is fetched, as
  // verified by the egress gateway. This field always contains a SPIFFE ID.
  string actor_spiffe_id = 2;
}

// FetchSecretResponse carries the resolved credential.
message FetchSecretResponse {
  // The raw bytes contains the secret.
  bytes opaque_bytes = 1 [ debug_redact = true ];
}
