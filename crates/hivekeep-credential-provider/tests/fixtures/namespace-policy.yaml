# The hive -> namespace authorization policy the credential provider
# enforces: an actor's hive may only resolve Secrets whose URI namespace is
# listed for it here. Enforcement is default-deny. The install creates this
# ConfigMap only when absent, granting nothing; the provider needs it to
# start, and reads it once at startup.
apiVersion: v1
kind: ConfigMap
metadata:
  name: hivekeep-credential-provider-namespace-policy
  namespace: hivekeep-system
data:
  namespace-policy.yaml: |
    # No hive may resolve any Secret until it is listed here, for example:
    #
    #   policies:
    #   - hive: team-a
    #     allowedNamespaces:
    #     - ns1
    policies: []
