apiVersion: hivekeep.io/v1
kind: SandboxConfig
metadata:
  name: gvisor-default
  annotations:
    sandboxconfig.hivekeep.io/is-class-default: "true"
spec:
  sandboxClass: gvisor
  defaultVersion: v6
  versions:
  # gVisor release 20261026.0: saves rootfs overlays and durable-dir volumes
  # as separate checkpoint bundles and restores sandboxes with no root
  # container.
  - name: v6
    state: Enabled
    assets:
      amd64:
        gvisor:
          url: "gs://gvisor/releases/release/20261026.0/x86_64/gvisor.tar.zstd"
          sha256: "708afc62f2ee82d19930c703e85f9dab4f27a78c0aec40c0f55eb1040107f1a7"
      arm64:
        gvisor:
          url: "gs://gvisor/releases/release/20261026.0/aarch64/gvisor.tar.zstd"
          sha256: "6257e49955f13e6caceb2c4181c5dc5406c460e805940c944e67ad65553f5b02"
