[package]
name = "hivekeep-demo-multiplex-ui"
description = "Dashboard for the Claude Code multiplex demo: workers, actors, pod logs and simulated task assignments"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "multiplex-ui"
path = "src/main.rs"

[dependencies]
hivekeep-telemetry = { workspace = true }
hivekeep-proto = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tonic = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
rustls = { workspace = true, features = ["ring"] }
axum = { workspace = true, features = ["default"] }
rand = { workspace = true }
k8s-openapi = { workspace = true }
kube = { workspace = true }

[dev-dependencies]
tower = { workspace = true }
http = { workspace = true }
