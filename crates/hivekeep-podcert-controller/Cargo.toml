[package]
name = "hivekeep-podcert-controller"
description = "Pod certificate controller for Hivekeep: issues service DNS, pod identity and PostgreSQL login certificates in answer to PodCertificateRequests."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "hivekeep-podcert-controller"
path = "src/main.rs"

[dependencies]
hivekeep-telemetry = { workspace = true }
hivekeep-core = { workspace = true }
hivekeep-identity = { workspace = true }
# Wall clock and work queue shared with the node agent.
hivekeep-node = { workspace = true }
hivekeep-k8s = { workspace = true }
# Names of the bundled PostgreSQL logins.
hivekeep-store = { workspace = true }

anyhow = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
rustls = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

k8s-openapi = { workspace = true }
kube = { workspace = true, features = ["runtime"] }

[dev-dependencies]
hivekeep-k8s = { workspace = true, features = ["testing"] }
parking_lot = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
x509-parser = { workspace = true, features = ["verify-aws"] }
# Requests in tests are built the way a workload builds them.
rcgen = { workspace = true, features = ["x509-parser"] }
