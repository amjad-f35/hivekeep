syntax = "proto3";

package hivekeep.objectstore.exchange.v1;

import "google/protobuf/timestamp.proto";

// CredentialExchange is served by the object-store control plugin, next to
// hivekeep-api, and called by the node plugin before a snapshot transfer. It
// turns a worker-for-actor JWT into a storage credential scoped to that
// actor's snapshot prefixes. It is private to the object-store plugin.
service CredentialExchange {
  // ExchangeActorJwt verifies actor_jwt and returns a credential limited to
  // the actor's snapshot prefixes. Errors:
  //   - INVALID_ARGUMENT: actor_jwt is empty.
  //   - UNAUTHENTICATED: actor_jwt fails signature, audience or expiry, or
  //     does not name an actor.
  //   - PERMISSION_DENIED: actor_jwt is not a worker-for-actor token, the
  //     actor has no snapshot location, the actor has left the node the token
  //     was minted for, or the actor is in a state with no transfer.
  //   - NOT_FOUND: the actor is gone or was recreated.
  //   - FAILED_PRECONDITION: the exchange is not allowed to read actors.
  //   - INTERNAL: the actor's grants cannot be derived or expressed as an
  //     access boundary.
  //   - UNAVAILABLE: hivekeep-api or the credential issuer cannot be reached.
  //   - CANCELLED, DEADLINE_EXCEEDED: the caller gave up first.
  rpc ExchangeActorJwt(ExchangeActorJwtRequest) returns (ExchangeActorJwtResponse);
}

message ExchangeActorJwtRequest {
  // A worker-for-actor JWT minted by hivekeep-api for the audience the plugin
  // requires. It names the node it was minted for, and is good only while the
  // actor is on that node.
  string actor_jwt = 1;

  // force skips the control plugin's token cache and mints a fresh credential
  // from the actor's current state. The node plugin sets it after storage
  // refused a credential it obtained earlier.
  bool force = 2;
}

message ExchangeActorJwtResponse {
  // The GCS OAuth access token.
  string access_token = 1;

  // When the credential expires.
  google.protobuf.Timestamp expire_time = 2;
}
