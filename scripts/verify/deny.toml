# cargo-deny configuration for scripts/verify/licenses.sh: licenses allowed in
# Hivekeep's dependency tree (permissive licenses only).
[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "MIT-0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CC0-1.0",
  "MPL-2.0",
  "OpenSSL",
  "CDLA-Permissive-2.0",
  "BSL-1.0",
]
confidence-threshold = 0.9
# Hivekeep's own crates are unpublished and carry no license field.
private = { ignore = true }
